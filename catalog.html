<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог запчастин</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
      color: #1a252f;
    }

    /* Панель пошуку */
    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border 0.2s;
    }

    .search-box input:focus {
      border-color: #007bff;
    }

    /* Сітка каталогу */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Картка товару */
    .product-card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      font-size: 12px;
      font-weight: bold;
      color: #007bff;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .article {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 12px;
      flex-grow: 1;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }

    /* Індикатор наявності */
    .stock-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .in-stock {
      background-color: #e6f4ea;
      color: #1e7e34;
    }

    .out-of-stock {
      background-color: #fce8e6;
      color: #d93025;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Каталог товарів</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Пошук за назвою, брендом або артикулом...">
    </div>

    <div id="catalog" class="catalog-grid">
      <!-- Товари завантажуються динамічно -->
    </div>
  </div>

  <script>
    let productsData = [];

    // 1. Завантаження JSON-файлу
    async function loadCatalog() {
      try {
        const response = await fetch('products.json');
        if (!response.ok) throw new Error('Не вдалося завантажити products.json');
        
        productsData = await response.json();
        renderCatalog(productsData);
      } catch (error) {
        console.error('Помилка:', error);
        document.getElementById('catalog').innerHTML = `<p style="color:red">Помилка завантаження каталогу. Перевірте наявність файлу products.json.</p>`;
      }
    }

    // 2. Відображення списку товарів
    function renderCatalog(products) {
      const container = document.getElementById('catalog');
      container.innerHTML = '';

      if (products.length === 0) {
        container.innerHTML = '<p>Нічого не знайдено</p>';
        return;
      }

      products.forEach(item => {
        // Перевірка наявності за полем "Облік" (або "Фактично")
        const inStock = item['Облік'] && item['Облік'] > 0;
        const stockText = inStock ? `В наявності (${item['Облік']} шт)` : 'Немає в наявності';
        const stockClass = inStock ? 'in-stock' : 'out-of-stock';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div>
            <div class="brand">${item['Бренд'] || 'Без бренду'}</div>
            <div class="article">Арт: ${item['Артикул'] || '-'}</div>
            <div class="title">${item['Назва'] || 'Без назви'}</div>
          </div>
          <div class="info-row">
            <div class="price">${item['Стара ціна'] ? item['Стара ціна'] + ' ' + (item['Валюта'] || 'UAH') : '—'}</div>
            <span class="stock-badge ${stockClass}">${stockText}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 3. Пошук і фільтрація в реальному часі
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = productsData.filter(item => {
        const name = (item['Назва'] || '').toLowerCase();
        const brand = (item['Бренд'] || '').toLowerCase();
        const article = (item['Артикул'] || '').toLowerCase();
        
        return name.includes(query) || brand.includes(query) || article.includes(query);
      });
      renderCatalog(filtered);
    });

    // Запуск завантаження при відкритті сторінки
    loadCatalog();
  </script>
</body>
</html>
