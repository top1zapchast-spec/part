<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТОР запчастина — Повний каталог товарів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- Header / Шапка -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-car"></i> ТОР запчастина
            </a>
            <nav class="hidden md:flex gap-6 font-medium">
                <a href="index.html" class="hover:text-amber-400 transition">Головна</a>
                <a href="catalog.html" class="text-amber-400 font-bold">Каталог</a>
                <a href="contacts.html" class="hover:text-amber-400 transition">Контакти</a>
            </nav>
            <button onclick="toggleCart()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-lg flex items-center gap-2 shadow transition relative">
                <i class="fa-solid fa-cart-shopping"></i> Кошик 
                <span id="cart-count" class="bg-slate-900 text-amber-400 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Головний контент -->
    <section class="container mx-auto px-4 py-8 flex-grow">
        <h1 class="text-3xl font-extrabold text-slate-900 text-center mb-2">Каталог товарів та залишків</h1>
        <p class="text-center text-gray-600 mb-6">Знайдено в каталозі: <span id="total-count" class="font-bold text-slate-900">0</span> позицій</p>

        <!-- Пошук по каталогу -->
        <div class="max-w-xl mx-auto mb-8">
            <div class="relative">
                <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Пошук за назвою, брендом або артикулом..." class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
            </div>
        </div>

        <!-- Сітка товарів -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Кнопки пагінації -->
        <div id="pagination" class="flex justify-center items-center gap-2 mt-8 flex-wrap"></div>
    </section>

    <!-- Модальне вікно кошика -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-xl relative max-h-[90vh] overflow-y-auto flex flex-col">
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-gray-500 hover:text-black text-2xl font-bold">&times;</button>
            <h3 class="text-2xl font-bold mb-4 text-slate-900">Ваше замовлення</h3>
            
            <div id="cart-items" class="space-y-3 mb-4 max-h-60 overflow-y-auto divide-y pr-1"></div>
            
            <div class="border-t pt-4 flex justify-between font-bold text-xl mb-4">
                <span>До сплати:</span>
                <span id="cart-total">0.00 грн</span>
            </div>

            <!-- Форма відправки замовлення -->
            <form action="https://formspree.io/f/xrpeqzro" method="POST" onsubmit="return handleOrderSubmit(event)" class="space-y-3">
                <input type="hidden" name="order_details" id="order-details-input">
                <input type="text" name="customer_name" placeholder="Ваше ім'я" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500">
                <input type="tel" name="customer_phone" placeholder="Номер телефону (+380...)" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500">
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg shadow transition">
                    Підтвердити замовлення
                </button>
            </form>
        </div>
    </div>

    <!-- Футер -->
    <footer class="bg-slate-900 text-gray-400 text-center py-6 mt-auto">
        <p>&copy; 2026 ТОР запчастина. м. Хмельницький. Телефон: +380 (68) 701-30-30</p>
    </footer>

    <!-- Обробка каталогу та кошика -->
    <script>
        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;
        const itemsPerPage = 24;
        let cart = []; // Елементи: { product, quantity }

        // Автоматичний добір зображень за ключовими словами
        function getImageUrl(name) {
            const n = (name || '').toLowerCase();
            if (n.includes('аккумулятор') || n.includes('акб') || n.includes('6ст')) return "https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=500&q=80";
            if (n.includes('олива') || n.includes('масло') || n.includes('змазка') || n.includes('рідина') || n.includes('фреон')) return "https://images.unsplash.com/photo-1615906655593-ad0386982a0f?auto=format&fit=crop&w=500&q=80";
            if (n.includes('диск') || n.includes('колодк') || n.includes('гальм') || n.includes('тормоз')) return "https://images.unsplash.com/photo-1486006920555-c77dce18193b?auto=format&fit=crop&w=500&q=80";
            if (n.includes('фільтр') || n.includes('фильтр')) return "https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=500&q=80";
            if (n.includes('амортизатор') || n.includes('важіль') || n.includes('опора') || n.includes('тяга') || n.includes('сайлентблок') || n.includes('підвіск') || n.includes('кульова') || n.includes('прокладк')) return "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=500&q=80";
            return "https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=500&q=80";
        }

        // Завантаження даних із products.json
        fetch('products.json')
            .then(res => {
                if (!res.ok) throw new Error('Помилка завантаження JSON');
                return res.json();
            })
            .then(data => {
                // Додаємо унікальні ID для коректної роботи кошика
                allProducts = data.map((item, idx) => ({
                    id: idx + 1,
                    brand: item['Бренд'] || 'Без бренду',
                    art: item['Артикул'] || '—',
                    name: item['Назва'] || 'Товар без назви',
                    price: parseFloat(item['Стара ціна'] || item['Нова ціна'] || 0),
                    currency: item['Валюта'] || 'UAH',
                    stock: parseFloat(item['Фактично'] !== undefined && item['Фактично'] !== null ? item['Фактично'] : (item['Облік'] || 0))
                }));
                
                filteredProducts = allProducts;
                document.getElementById('total-count').innerText = allProducts.length;
                renderPage(1);
            })
            .catch(err => {
                console.error('Помилка завантаження каталогу:', err);
                document.getElementById('products-grid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500 font-medium">
                        Не вдалося завантажити products.json. Переконайтеся, що файл знаходиться в одній папці з сторінкою.
                    </div>`;
            });

        // Відображення товарів на сторінці
        function renderPage(page) {
            currentPage = page;
            const grid = document.getElementById('products-grid');
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const itemsToShow = filteredProducts.slice(start, end);

            if (itemsToShow.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500 font-medium">Товарів за вашим запитом не знайдено</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            grid.innerHTML = itemsToShow.map(p => {
                const inStock = p.stock > 0;
                const stockBadge = inStock 
                    ? `<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded">В наявності: ${p.stock} шт</span>`
                    : `<span class="bg-red-100 text-red-800 text-xs font-semibold px-2.5 py-0.5 rounded">Немає в наявності</span>`;

                return `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <img src="${getImageUrl(p.name)}" alt="${p.name}" class="w-full h-44 object-cover">
                            <div class="p-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs bg-slate-900 text-amber-400 font-bold px-2 py-0.5 rounded">${p.brand}</span>
                                    <span class="text-xs text-gray-500 font-mono">Арт: ${p.art}</span>
                                </div>
                                <h3 class="text-base font-bold text-slate-900 line-clamp-2 mb-2">${p.name}</h3>
                                <div>${stockBadge}</div>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <div class="mt-2 pt-3 border-t flex justify-between items-center">
                                <span class="text-xl font-extrabold text-slate-900">${p.price.toFixed(2)} грн</span>
                                <button onclick="addToCart(${p.id})" ${!inStock ? 'disabled class="bg-gray-300 text-gray-500 font-bold px-3 py-2 rounded-lg text-sm cursor-not-allowed"' : 'class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-2 rounded-lg text-sm transition shadow"'}>
                                    + У кошик
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination();
        }

        // Пагінація
        function renderPagination() {
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            const container = document.getElementById('pagination');
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = '';
            const maxButtons = 7;
            let startPage = Math.max(1, currentPage - 3);
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);

            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            if (currentPage > 1) {
                html += `<button onclick="renderPage(${currentPage - 1})" class="px-3 py-1.5 rounded-lg border bg-white text-gray-700 hover:bg-gray-100">&laquo;</button>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="renderPage(${i})" class="px-3 py-1.5 rounded-lg border ${i === currentPage ? 'bg-amber-500 text-slate-900 font-bold' : 'bg-white text-gray-700 hover:bg-gray-100'}">${i}</button>`;
            }

            if (currentPage < totalPages) {
                html += `<button onclick="renderPage(${currentPage + 1})" class="px-3 py-1.5 rounded-lg border bg-white text-gray-700 hover:bg-gray-100">&raquo;</button>`;
            }

            container.innerHTML = html;
        }

        // Пошук
        function handleSearch() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            filteredProducts = allProducts.filter(p => 
                p.name.toLowerCase().includes(q) || 
                p.brand.toLowerCase().includes(q) || 
                p.art.toLowerCase().includes(q)
            );
            document.getElementById('total-count').innerText = filteredProducts.length;
            renderPage(1);
        }

        // Робота з кошиком
        function addToCart(id) {
            const prod = allProducts.find(p => p.id === id);
            if (!prod) return;

            const existingItem = cart.find(item => item.product.id === id);
            if (existingItem) {
                if (existingItem.quantity < prod.stock) {
                    existingItem.quantity++;
                } else {
                    alert('Досягнуто максимальну кількість даного товару в наявності!');
                }
            } else {
                cart.push({ product: prod, quantity: 1 });
            }
            updateCart();
        }

        function changeQuantity(id, delta) {
            const item = cart.find(i => i.product.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.product.id !== id);
                } else if (item.quantity > item.product.stock) {
                    item.quantity = item.product.stock;
                    alert('Досягнуто максимальну кількість в наявності');
                }
            }
            updateCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.product.id !== id);
            updateCart();
        }

        function updateCart() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalCount;
            
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">Кошик порожній</p>';
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center pt-3 pb-2">
                        <div class="flex-grow pr-2">
                            <p class="font-bold text-sm text-slate-900">${item.product.name}</p>
                            <p class="text-xs text-gray-500">[${item.product.brand}] Арт: ${item.product.art}</p>
                            <p class="text-xs font-semibold text-slate-800">${item.product.price.toFixed(2)} грн / шт</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center border rounded">
                                <button onclick="changeQuantity(${item.product.id}, -1)" class="px-2 py-0.5 text-gray-600 hover:bg-gray-100 font-bold">-</button>
                                <span class="px-2 text-sm font-bold">${item.quantity}</span>
                                <button onclick="changeQuantity(${item.product.id}, 1)" class="px-2 py-0.5 text-gray-600 hover:bg-gray-100 font-bold">+</button>
                            </div>
                            <button onclick="removeFromCart(${item.product.id})" class="text-red-500 hover:text-red-700 text-sm pl-1">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            const totalSum = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            document.getElementById('cart-total').innerText = totalSum.toFixed(2) + ' грн';

            // Формування підсумкового текст замовлення для відправки
            const orderText = cart.map(i => `[${i.product.brand}] ${i.product.name} (Арт: ${i.product.art}) - ${i.quantity} шт. x ${i.product.price} грн = ${(i.quantity * i.product.price).toFixed(2)} грн`).join('\n');
            document.getElementById('order-details-input').value = `ЗАМОВЛЕННЯ:\n${orderText}\n\nЗАГАЛЬНА СУМА: ${totalSum.toFixed(2)} грн`;
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function handleOrderSubmit(e) {
            if (cart.length === 0) {
                alert('Ваш кошик порожній!');
                e.preventDefault();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
